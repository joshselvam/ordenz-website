# OrdenZ website. Thin entry: triggers and stage order only.
#
#   test  →  build
#
# These are the checks branch protection requires before a pull request can merge.
# Publishing is done by Cloudflare's Git connection only (Workers & Pages → www):
#   main → www.ordenz.com (npx wrangler deploy), qa → qa.ordenz.com (www-qa Worker),
#   other branches → a preview version (npx wrangler versions upload).
# Actions never deploys, so a merge can't publish twice.
name: Website

on:
  pull_request:
  push:
    branches: [main, master, qa, develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/website-test.yml

  build:
    needs: test
    uses: ./.github/workflows/website-build.yml

  summary:
    needs: [test, build]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          echo "===================================================="
          echo "                   Build summary                     "
          echo "===================================================="
          echo "Test:  ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Cloudflare publishes main (www) and qa (qa.ordenz.com); Actions does not deploy."
