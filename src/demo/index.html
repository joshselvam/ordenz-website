<!doctype html><html lang="en" data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* The standalone sample follows the current light workspace palette. */
:root[data-theme="light"]{--bg:#F6F5EE;--surface:#FFFEFB;--surface-2:#EDF2E8;--line:#D8E1D5;--muted:#54665B;--accent-soft:#E1ECDF}
.sample-notice{padding:8px 16px;background:#E9EEDF;color:#173C32;font-size:13px;border-bottom:1px solid #D8E1D5;flex-shrink:0}
.sample-notice a{color:#0E5B49;font-weight:700}
#app{min-height:0}
.bar{flex-wrap:wrap;height:auto;flex-shrink:0}.tabs{flex-wrap:wrap}
</style>
<title>OrdenZ — Offline sample</title>
<link rel="icon" type="image/png" href="/assets/brand/favicon-32.png?v=crest-1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hind+Madurai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. Thin staff bar on top, each mode fills the rest.
   Kiosk = big touch tiles + bottom cart bar; counter = menu grid | bill panel. */
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --surface-2:#ECEFE9; --line:#D9DFD8;
  --ink:#14211C; --ink-2:#46564F; --muted:#76857E;
  --accent:#0E5B49; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --saffron:#E39A17; --saffron-ink:#2A1900; --saffron-soft:#FBEBCB;
  --good:#1E8A4B; --warn:#B86E00; --bad:#BF3328;
  --good-soft:#DDF1E4; --warn-soft:#FBEBD0; --bad-soft:#F8DEDB;
  --board-bg:#0D1412; --board-ink:#F1F5F2; --board-muted:#8FA39A; --board-ready:#F2B23E;
  --shadow:0 1px 2px rgba(20,33,28,.06),0 6px 20px rgba(20,33,28,.06);
  --f-display:"Bricolage Grotesque","Hind Madurai",system-ui,sans-serif;
  --f-body:"Hind Madurai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2723; --line:#2A3631;
  --ink:#E7EEEA; --ink-2:#B2C0B9; --muted:#84948D;
  --accent:#3DB291; --accent-ink:#04201A; --accent-soft:#16352D;
  --saffron:#F0B13D; --saffron-ink:#231500; --saffron-soft:#3A2C12;
  --good:#4CC47E; --warn:#E6A43A; --bad:#EF6A5D;
  --good-soft:#163222; --warn-soft:#382A12; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2723; --line:#2A3631;
  --ink:#E7EEEA; --ink-2:#B2C0B9; --muted:#84948D;
  --accent:#3DB291; --accent-ink:#04201A; --accent-soft:#16352D;
  --saffron:#F0B13D; --saffron-ink:#231500; --saffron-soft:#3A2C12;
  --good:#4CC47E; --warn:#E6A43A; --bad:#EF6A5D;
  --good-soft:#163222; --warn-soft:#382A12; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

#app{height:100%;display:flex;flex-direction:column}
/* ---------- staff bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;color:var(--accent)}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:999px;color:var(--ink-2);font-weight:600;font-size:14px}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--saffron);color:var(--saffron-ink);font-size:11px;line-height:18px;text-align:center}
.ghost{padding:7px 10px;border-radius:8px;color:var(--ink-2);font-size:13px;font-weight:600;border:1px solid var(--line)}
.ghost:hover{background:var(--surface-2)}
main{flex:1;min-height:0;overflow:auto}
body.kiosk-only .bar{display:none}
.exitk{position:fixed;right:10px;bottom:10px;z-index:30;opacity:.35;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.exitk:hover{opacity:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;font-weight:700}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-cta{background:var(--saffron);color:var(--saffron-ink)}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill svg{width:12px;height:12px}

/* ---------- KIOSK ---------- */
.kiosk{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.k-attract{flex:1;display:grid;place-items:center;text-align:center;padding:24px 16px;cursor:pointer;
  background:radial-gradient(1200px 500px at 50% 110%,var(--accent-soft),transparent 70%),var(--bg)}
.k-attract h1{font-size:clamp(40px,8vw,84px);font-weight:800;line-height:1;color:var(--accent)}
.k-attract .sub{font-size:clamp(18px,2.6vw,24px);color:var(--ink-2);margin-top:12px}
.k-attract .touch{margin-top:36px;display:inline-block;padding:18px 34px;border-radius:999px;background:var(--saffron);color:var(--saffron-ink);font-family:var(--f-display);font-size:clamp(20px,3vw,28px);font-weight:800;animation:pulse 2.2s ease-in-out infinite}
.k-attract .offer{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.k-attract .offer div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font-weight:600;color:var(--ink-2)}
.k-attract .offer b{color:var(--ink)}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.k-attract .touch{animation:none}}
.k-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.k-head h2{font-size:22px;margin-right:auto}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{padding:6px 12px;font-weight:700;font-size:14px}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.k-type{flex:1;display:grid;place-items:center;padding:24px 16px}
.k-type .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;width:min(720px,100%)}
.k-type button{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--f-display);font-size:26px;font-weight:800;box-shadow:var(--shadow)}
.k-type button:hover{border-color:var(--accent)}
.k-type svg{width:84px;height:84px;color:var(--accent)}
.k-body{flex:1;min-height:0;display:grid;grid-template-columns:200px 1fr}
.k-cats{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.k-cat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;font-weight:700;text-align:left;font-size:16px;color:var(--ink-2)}
.k-cat svg{width:30px;height:30px;flex:none}
.k-cat[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.k-items{overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;align-content:start;grid-auto-rows:max-content}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile .art{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--surface-2)}
.tile .art svg{width:46%;height:auto;color:var(--accent)}
.tile .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.tile .nm{font-weight:700;font-size:16px;line-height:1.25}
.tile .pr{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--accent)}
.tile .tag{position:absolute;top:8px;left:8px}
.tile.soldout{opacity:.55;cursor:not-allowed}
.tile.soldout .art::after{content:attr(data-so);position:absolute;inset:auto 0 50% 0;text-align:center;font-weight:800;color:var(--bad);font-size:18px;letter-spacing:.05em}
.k-cartbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.k-cartbar .sum{margin-right:auto;font-size:16px;color:var(--ink-2)}
.k-cartbar .sum b{font-family:var(--f-display);font-size:24px;color:var(--ink)}
.k-review{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center}
.k-review .inner{width:min(720px,100%);display:flex;flex-direction:column;gap:12px}
.line{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.line .info{flex:1;min-width:0}
.line .info .nm{font-weight:700;font-size:17px}
.line .info .ad{font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:10px;background:var(--surface-2);font-size:20px;font-weight:700}
.qty span{min-width:24px;text-align:center;font-weight:700}
.line .amt{font-family:var(--f-display);font-weight:800;min-width:74px;text-align:right}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.totals .row{display:flex;justify-content:space-between;color:var(--ink-2)}
.totals .row.big{color:var(--ink);font-family:var(--f-display);font-size:24px;font-weight:800;margin-top:4px}
.k-pay,.k-done{flex:1;overflow:auto;display:grid;place-items:center;padding:24px 16px;text-align:center}
.paycard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:var(--shadow)}
.paycard canvas{width:220px;height:220px;max-width:100%;border-radius:8px;background:#fff;padding:10px}
.paycard .amt{font-family:var(--f-display);font-size:40px;font-weight:800}
.progress{width:100%;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s linear}
.tokenbig{font-family:var(--f-display);font-size:clamp(90px,18vw,170px);font-weight:800;line-height:1;color:var(--accent)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.5);display:grid;place-items:center;padding:16px;z-index:40}
.modal{background:var(--surface);border-radius:20px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:24px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--accent)}
.opt .p{margin-left:auto;font-weight:700;color:var(--ink-2)}
.upsell{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.upsell button{border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface)}
.upsell button:hover{border-color:var(--saffron)}
.upsell svg{width:64px;height:64px;color:var(--accent)}
.row-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* option groups (Size, Milk, Syrup...) */
.optgroup{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.optgroup legend{display:flex;align-items:baseline;gap:8px;padding:0;margin-bottom:8px;font-weight:700}
.optgroup legend small{font-weight:500;color:var(--muted);font-size:12px}
.optlist{display:flex;flex-direction:column;gap:8px}
.optlist.seg-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.seg-opts .opt{min-width:0;flex-wrap:wrap;column-gap:8px;row-gap:2px;padding:10px 12px}
.seg-opts .opt .p{margin-left:0;flex-basis:100%;padding-left:34px;font-size:13px}
.opt input{flex:none}
.opt .p{white-space:nowrap}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* ---------- COUNTER ---------- */
.counter{height:100%;display:grid;grid-template-columns:1fr 380px;min-height:0}
.c-left{display:flex;flex-direction:column;min-height:0;min-width:0}
.c-tools{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--surface)}
.c-tools input{flex:1;min-width:160px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.c-wait{padding:10px 16px;background:var(--saffron-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.c-wait .w{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:6px 6px 6px 10px;font-weight:600}
.c-wait .w button{padding:6px 10px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700}
.c-grid{flex:1;overflow:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;grid-auto-rows:max-content}
.c-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.c-item:hover{border-color:var(--accent)}
.c-item .nm{font-weight:700;line-height:1.2}
.c-item .pr{color:var(--accent);font-weight:700;margin-top:auto}
.c-item.soldout{opacity:.45;cursor:not-allowed}
.c-bill{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.c-bill header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:8px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.c-lines{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column}
.bl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bl .nm{font-weight:600;line-height:1.2;min-width:0}
.bl .qty button{width:30px;height:30px;font-size:16px}
.bl .amt{min-width:64px;text-align:right;font-weight:700}
.c-empty{margin:auto;color:var(--muted);text-align:center;padding:24px}
.c-foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.c-foot .row{display:flex;justify-content:space-between;color:var(--ink-2);font-size:14px}
.c-foot .row.big{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--ink)}
.paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paybtns .btn{padding:12px 6px}

/* receipt */
.receipt{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px;background:#fff;color:#111;border-radius:6px;padding:16px;line-height:1.5;border:1px dashed #bbb}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt .tk{font-size:22px;font-weight:700}

/* ---------- KITCHEN ---------- */
.kitchen{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px 16px;min-height:0}
.k-col{display:flex;flex-direction:column;min-height:0;background:var(--surface-2);border-radius:var(--r);padding:10px}
.k-col h3{font-size:16px;display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.k-col .list{overflow:auto;display:flex;flex-direction:column;gap:10px}
.ticket{background:var(--surface);border-radius:12px;padding:12px;border-left:5px solid var(--accent);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.ticket.late{border-left-color:var(--bad)}
.ticket.warmish{border-left-color:var(--warn)}
.ticket .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ticket .tk{font-family:var(--f-display);font-size:28px;font-weight:800;margin-right:auto}
.ticket ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.ticket li{font-weight:600}
.ticket li small{display:block;color:var(--muted);font-weight:500}
.ticket .el{font-weight:700;color:var(--ink-2)}
.ticket.late .el{color:var(--bad)}
.empty-col{color:var(--muted);text-align:center;padding:30px 10px}

/* ---------- TOKEN BOARD (always dark: it's a TV) ---------- */
.board{height:100%;background:var(--board-bg);color:var(--board-ink);display:grid;grid-template-columns:1fr 1.4fr;gap:0;min-height:0}
.board section{padding:28px 32px;display:flex;flex-direction:column;gap:18px;min-height:0;overflow:hidden}
.board section+section{border-left:1px solid #26332e}
.board h2{font-size:clamp(20px,3vw,34px);color:var(--board-muted);font-weight:700}
.board .ready h2{color:var(--board-ready)}
.board .toks{display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start}
.board .t{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.board .prep .t{font-size:clamp(28px,4vw,48px);color:var(--board-muted);padding:4px 14px;border:1px solid #2c3a35;border-radius:12px}
.board .ready .t{font-size:clamp(56px,9vw,120px);color:var(--board-ready);line-height:1;padding:8px 22px;border:2px solid var(--board-ready);border-radius:18px}
.board .ready .t.new{animation:flash 1s ease-in-out 3}
@keyframes flash{50%{background:var(--board-ready);color:var(--board-bg)}}
@media (prefers-reduced-motion:reduce){.board .ready .t.new{animation:none}}
.board .foot{margin-top:auto;color:var(--board-muted);font-size:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.board .none{color:#5f726a;font-size:22px}

/* ---------- STOCK & OWNER (page layouts) ---------- */
.page{padding-block:18px 40px;padding-inline:16px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:28px;margin-right:auto}
.page-head p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:18px;margin-bottom:12px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.meter{width:120px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.recv{display:flex;gap:6px;align-items:center}
.recv input{width:90px;padding:6px 8px}
.recv button{padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);flex:none}
.switch[aria-checked="true"]{background:var(--good)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]::after{left:21px}
.recipe{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl .label,.kpi.hl .s{color:var(--accent-ink);opacity:.8}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto}
.chartwrap text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:10px;align-items:center;padding:5px 0}
.hbar .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hbar .v{font-weight:700;font-size:14px;min-width:70px;text-align:right}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.wa{background:var(--surface-2);border-radius:12px;padding:14px;font-size:14px;white-space:pre-line;line-height:1.55}
.alert-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:0}
.alert-row .nm{font-weight:600;margin-right:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.help{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.help ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .counter{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .c-bill{border-left:0;border-top:1px solid var(--line);max-height:55vh}
  .grid2{grid-template-columns:1fr}
  .kitchen{grid-template-columns:1fr;overflow:auto}
  .k-col{min-height:auto}
  .board{grid-template-columns:1fr}
  .board section+section{border-left:0;border-top:1px solid #26332e}
}
@media (max-width:640px){
  .k-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .k-cats{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .k-cat{flex:none;padding:8px 12px;font-size:14px}
  .k-cat svg{width:22px;height:22px}
  .k-items{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px}
  .brand span{display:none}
  .k-head{flex-wrap:wrap;gap:8px}
  .k-head h2{font-size:18px;flex:1 1 100%}
  .bar{gap:8px;padding:6px 12px}
  .tab{padding:5px 9px;font-size:13px}
  .ghost{padding:5px 8px;font-size:12px}
  .k-cartbar .btn{padding:10px 14px}
  .meter{width:70px}
}
</style>

/* =========================================================
   State, persistence and cross-tab sync
   ========================================================= */
const LS_KEY = "ordenz-demo-v1";
let S = null;
const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");
const clone = o => JSON.parse(JSON.stringify(o));
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function seedState(){
  const st = {day:todayKey(), ing:clone(ING0), menu:MENU0.map(m=>({id:m.id,price:m.price,on:true})), orders:[], nextToken:101, nextBill:1};
  // Generate today's earlier orders so the owner dashboard has data.
  const now = new Date();
  const open = new Date(now); open.setHours(8,0,0,0);
  let start = open.getTime();
  const threeH = now.getTime()-3*3600e3;
  if (threeH < start) start = threeH;
  const end = now.getTime()-4*60e3;
  const r = rng(now.getDate()*7919 + now.getMonth()*31);
  const weights = WEIGHTS;
  const pool=[]; Object.keys(weights).forEach(k=>{for(let i=0;i<weights[k];i++)pool.push(k);});
  let t = start;
  while (t < end){
    const h = new Date(t).getHours();
    const busy = (h>=11&&h<14)||(h>=16&&h<20) ? 2.4 : 1;
    t += (60e3*10/busy)*(0.4+r()*1.2);
    if (t>=end) break;
    const nLines = 1 + Math.floor(r()*r()*3);
    const lines=[];
    for(let i=0;i<nLines;i++){
      const id = pool[Math.floor(r()*pool.length)];
      const ex = lines.find(l=>l.itemId===id);
      if(ex) ex.qty++; else lines.push({itemId:id,qty:1+(r()<.2?1:0),addons:defaultAddons(MENU0.find(m=>m.id===id))});
    }
    const src = r()<.56?"kiosk":"counter";
    const pay = r()<.6?"upi":(r()<.8?"cash":"card");
    let upsell = 0;
    if (src==="kiosk" && r()<.32){ const u = r()<.5?"chocolate-brownie":"butter-croissant"; lines.push({itemId:u,qty:1,addons:[],upsell:true}); upsell = MENU0.find(m=>m.id===u).price; }
    const o = makeOrder(st, lines, {source:src, type:r()<.62?"dine":"take", payment:pay, status:"served", at:t, upsell, deduct:false});
    o.servedAt = t + (5+r()*7)*60e3;
  }
  return st;
}

function load(){
  let st=null;
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) st = JSON.parse(raw); }catch(e){ st=null; }
  if(!st || st.day!==todayKey() || !st.ing || !st.menu) st = seedState();
  S = st; save(false);
}
let bc=null; try{ bc = new BroadcastChannel("ordenz-demo"); bc.onmessage = ()=>{ reloadFromStorage(); }; }catch(e){ bc=null; }
function save(broadcast=true){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(broadcast && bc){ try{ bc.postMessage("changed"); }catch(e){} }
}
function reloadFromStorage(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ S = JSON.parse(raw); render(true); } }catch(e){}
}
window.addEventListener("storage", e=>{ if(e.key===LS_KEY) reloadFromStorage(); });

/* ---------- menu helpers ---------- */
const itemDef = id => MENU0.find(m=>m.id===id);
const itemState = id => S.menu.find(m=>m.id===id);
const ingById = id => S.ing.find(i=>i.id===id);
const nm = (o,lang) => (lang==="ta" && o.ta) ? o.ta : o.en;
function priceOf(id){ return itemState(id).price; }
function addonsFor(item){ return groupsFor(item).flatMap(g=>g.options); }
function addonDef(item, aid){ return ADDON_INDEX[aid]; }
function adText(l,lang){ const g=itemDef(l.itemId).groups||[]; return (l.addons||[]).map(a=>ADDON_INDEX[a]).filter(visibleAddon).sort((x,y)=>g.indexOf(x.group)-g.indexOf(y.group)).map(a=>nm(a,lang)).join(", "); }
function linePrice(l){ const it=itemDef(l.itemId); const a=(l.addons||[]).reduce((s,aid)=>s+(addonDef(it,aid)?.price||0),0); return (priceOf(l.itemId)+a)*l.qty; }
function lineRecipe(l){ const it=itemDef(l.itemId); const need={}; const add=(r,m)=>{for(const k in r){need[k]=(need[k]||0)+r[k]*m;}}; add(it.r,l.qty); (l.addons||[]).forEach(aid=>{const a=addonDef(it,aid); if(a) add(a.r,l.qty);}); return need; }
function canMake(id, extraNeed){
  const it=itemDef(id); let max=Infinity;
  for(const k in it.r){ const have = ingById(k).stock - ((extraNeed&&extraNeed[k])||0); max = Math.min(max, Math.floor(have/it.r[k])); }
  return Math.max(0,max);
}
function isAvailable(id, extraNeed){ return itemState(id).on && canMake(id, extraNeed) >= 1; }
function cartNeed(lines){ const need={}; lines.forEach(l=>{const r=lineRecipe(l); for(const k in r) need[k]=(need[k]||0)+r[k];}); return need; }
function stockStatus(i){ if(i.stock<=0) return "out"; if(i.stock<=i.reorder) return "low"; return "ok"; }

/* ---------- orders ---------- */
function makeOrder(st, lines, o){
  const total = lines.reduce((s,l)=>{ const it=MENU0.find(m=>m.id===l.itemId); const ps=(st.menu.find(m=>m.id===l.itemId)||{price:it.price}).price; const a=(l.addons||[]).reduce((x,aid)=>x+(ADDON_INDEX[aid]?.price||0),0); return s+(ps+a)*l.qty; },0);
  const disc = o.discount ? Math.round(total*o.discount/100) : 0;
  const order = {id:"o"+Date.now().toString(36)+Math.floor(Math.random()*1e4), token:st.nextToken++, bill:st.nextBill++,
    source:o.source, type:o.type, payment:o.payment, status:o.status, at:o.at||Date.now(),
    lines:clone(lines), total:total-disc, discount:disc, upsell:o.upsell||0};
  if(st.nextToken>999) st.nextToken=101;
  if(o.deduct!==false){
    lines.forEach(l=>{ const need = (function(){ const it=MENU0.find(m=>m.id===l.itemId); const n={}; for(const k in it.r) n[k]=(n[k]||0)+it.r[k]*l.qty; (l.addons||[]).forEach(aid=>{const a=ADDON_INDEX[aid]; if(a) for(const k in a.r) n[k]=(n[k]||0)+a.r[k]*l.qty;}); return n; })();
      for(const k in need){ const ing=st.ing.find(i=>i.id===k); ing.stock=Math.max(0, ing.stock-need[k]); } });
  }
  st.orders.push(order);
  return order;
}
function setStatus(id, status){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  o.status=status; if(status==="preparing") o.startedAt=Date.now(); if(status==="ready") o.readyAt=Date.now(); if(status==="served") o.servedAt=Date.now();
  save(); render(true);
}

function showUpsell(){
  K.upsellShown=true;
  // Coffee-shop pairing: a drink gets a bakery suggestion, food gets a drink suggestion
  const icons = K.cart.map(l=>itemDef(l.itemId).icon);
  const has = (...xs)=>icons.some(i=>xs.includes(i));
  const inCart = id=>K.cart.some(l=>l.itemId===id);
  const pick = list=>MENU0.filter(m=>list.includes(m.icon) && !inCart(m.id) && isAvailable(m.id,cartNeed(K.cart))).sort((a,b)=>(b.tag==="Bestseller")-(a.tag==="Bestseller")||a.price-b.price)[0];
  const sugg=[];
  const drink=has("cup","glass"), food=has("cake","sandwich","wrap","fries"), combo=has("tray");
  if(drink && !food && !combo){ sugg.push(pick(["cake"])); sugg.push(pick(["sandwich"])); }
  if(food && !drink && !combo){ sugg.push(pick(["glass"])); sugg.push(pick(["cup"])); }
  sugg.splice(0, sugg.length, ...sugg.filter(Boolean).map(m=>m.id));
  const need = cartNeed(K.cart);
  const list = sugg.filter(id=>isAvailable(id,need)).slice(0,2);
  if(!list.length) return false;
  modal(`<h3>${t("upsellT")}</h3><div class="upsell">${list.map(id=>{const it=itemDef(id); return `<button type="button" data-up="${id}">${ICON[it.icon]}<b>${esc(nm(it,K.lang))}</b><span class="num" style="font-weight:800;color:var(--accent)">+${rupee(priceOf(id))}</span></button>`;}).join("")}</div>

}

function drawQR(){
  const c=document.getElementById("qr"); if(!c) return; const ctx=c.getContext("2d"); const n=29, s=Math.floor(c.width/n);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle="#111";
  const r = rng(Math.round(cartTotal())*131+7);
  const finder=(x,y)=>{ ctx.fillRect(x*s,y*s,7*s,7*s); ctx.fillStyle="#fff"; ctx.fillRect((x+1)*s,(y+1)*s,5*s,5*s); ctx.fillStyle="#111"; ctx.fillRect((x+2)*s,(y+2)*s,3*s,3*s); };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if(!inF && r()<.48) ctx.fillRect(x*s,y*s,s,s); }
  finder(0,0); finder(n-7,0); finder(0,n-7);
}
function startPay(){
  drawQR(); clearInterval(K.payTimer);
  const t0=Date.now(), dur=7000;
  K.payTimer=setInterval(()=>{ const p=Math.min(1,(Date.now()-t0)/dur); const bar=document.getElementById("payProg"); if(!bar){clearInterval(K.payTimer);return;} bar.style.width=(p*100)+"%";
    if(p>=1){ clearInterval(K.payTimer); finishKiosk("upi"); } },200);

function finishKiosk(method){
  clearInterval(K.payTimer);
  if(!K.cart.length) return;
  const upsell = K.cart.filter(l=>l.upsell).reduce((s,l)=>s+linePrice(l),0);
  const o = makeOrder(S, K.cart, {source:"kiosk", type:K.type, payment: method==="upi"?"upi":"cash", status: method==="upi"?"new":"awaiting", upsell});
  save(); K.lastOrder=o; K.cart=[]; K.step="done"; K.upsellShown=false; render();
  clearTimeout(K.doneTimer); K.doneTimer=setTimeout(()=>{ if(view==="kiosk"&&K.step==="done"){ kioskReset(); render(); } },15000);
}

    </tbody></table></div></div></div>`;

Sales: ${rupee(sales)} from ${n} orders

Kiosk upsells added: ${rupee(ups)}
Busiest hour: ${hh(peak.h)} (${rupee(peak.v)})

${lows.length?"Reorder: "+lows.map(i=>i.name).join(", "):"Stock: all good"}`;

    <div class="tiles">
      <div class="kpi hl"><span class="label">Sales today</span><span class="v">${rupee(sales)}</span><span class="s">${n} orders · includes GST</span></div>

      <div class="kpi"><span class="label">Kiosk share</span><span class="v">${kShare}%</span><span class="s">of today's sales</span></div>
      <div class="kpi"><span class="label">Upsell revenue</span><span class="v">${rupee(ups)}</span><span class="s">from "Would you like to add?"</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Sales by hour</h2><div class="chartwrap" id="hourChart"></div><p style="margin:8px 0 0;color:var(--muted);font-size:13px">Busiest hour so far: <b style="color:var(--ink)">${hh(peak.h)}</b>, ${rupee(peak.v)} from ${peak.c} orders.</p></div>

function niceMax(v){ if(v<=0) return 1000; const p=Math.pow(10,Math.floor(Math.log10(v))); const m=v/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function drawHourChart(data){
  const box=document.getElementById("hourChart"); if(!box) return;
  const W=640,H=240,ml=52,mr=10,mt=12,mb=28; const iw=W-ml-mr, ih=H-mt-mb;
  const max=niceMax(Math.max(...data.map(d=>d.v),1)); const ticks=4;
  const bw=iw/data.length; const barW=Math.max(6,bw-6);
  const y=v=>mt+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales by hour today">`;
  for(let i=0;i<=ticks;i++){ const v=max/ticks*i; const yy=y(v); s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"${i?' stroke-dasharray="2 4"':""}/><text x="${ml-8}" y="${yy+4}" text-anchor="end">${v>=1000?"₹"+(v/1000).toFixed(v%1000?1:0)+"k":"₹"+v}</text>`; }
  data.forEach((d,i)=>{ const x=ml+i*bw+(bw-barW)/2; const h=Math.max(0,(d.v/max)*ih); const yy=mt+ih-h; const r=Math.min(4,h,barW/2);
    if(h>0) s+=`<path d="M${x},${mt+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+barW-r} Q${x+barW},${yy} ${x+barW},${yy+r} V${mt+ih} Z" fill="var(--accent)"/>`;
    s+=`<rect x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    if(i%2===0) s+=`<text x="${x+barW/2}" y="${H-8}" text-anchor="middle">${(d.h%12||12)}${d.h<12?"a":"p"}</text>`; });
  s+=`</svg><div class="tip" id="htip" hidden></div>`;
  box.innerHTML=s;
  const tip=document.getElementById("htip"); const svg=box.querySelector("svg");
  svg.addEventListener("mousemove",e=>{ const r=e.target.closest("rect[data-i]"); if(!r){ tip.hidden=true; return; } const d=data[+r.dataset.i]; const bb=svg.getBoundingClientRect(); const sc=bb.width/W;
    tip.innerHTML=`<b>${(d.h%12||12)}:00 ${d.h<12?"am":"pm"}</b> · ${rupee(d.v)} · ${d.c} orders`; tip.style.left=((ml+(+r.dataset.i+0.5)*bw)*sc)+"px"; tip.style.top=(y(d.v)*sc)+"px"; tip.hidden=false; });
  svg.addEventListener("mouseleave",()=>{ tip.hidden=true; });
}

/* =========================================================
   Boot
   ========================================================= */
load();
view = readHash();
if(!location.hash){ try{ const v=localStorage.getItem(LS_KEY+"-view"); if(v && VIEWS.some(x=>x.id===v)) view=v; }catch(e){} }
window.addEventListener("hashchange",()=>{ const v=readHash(); if(v!==view){ view=v; render(); } });
render();
// Refresh live screens every 15s so new orders show even without tab sync
setInterval(()=>{ if(view==="board"||view==="owner") render(); },15000);
})();
</script>
